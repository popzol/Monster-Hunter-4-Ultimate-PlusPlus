[project]
name = "mh4u-rando"
version = "0.1.0"
description = "Monster Hunter 4 Ultimate quest randomizer"
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2"]

[project.optional-dependencies]
audio = ["numpy>=1.24"]  # mh4u_rando.audio encoder (custom music)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
